<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Site Builder</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#1f1e1d;--mut:#73726c;--line:#e6e3da;--acc:#c6613f;--user:#f0eee6}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--card:#30302e;--ink:#f0eee6;--mut:#a09f98;--line:#444340;--user:#3a3936}}
:root[data-th=light]{--bg:#faf9f5;--card:#fff;--ink:#1f1e1d;--mut:#73726c;--line:#e6e3da;--user:#f0eee6}
:root[data-th=dark]{--bg:#262624;--card:#30302e;--ink:#f0eee6;--mut:#a09f98;--line:#444340;--user:#3a3936}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hide{display:none!important}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.ib:hover,.ib:active{background:var(--user);color:var(--ink)}
.ib.on{color:var(--ink)}.ib.on svg{fill:currentColor}
/* HOME */
#home{height:100%;display:flex;flex-direction:column;padding:10px 14px}
.top{display:flex;justify-content:space-between}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
#cont{display:none!important}
#rbr{display:none;max-width:min(92vw,520px);margin:8px auto 0;padding:0 14px;text-align:center}
#rbr.on{display:block;animation:rbdin .4s}
#rbrt{max-height:24vh;overflow-y:auto;font-size:16px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-break:break-word}
#rbrt.ph{color:var(--mut)}
.rbra{display:flex;justify-content:center;gap:16px;margin-top:6px}
.rbra button{width:34px;height:34px;display:grid;place-items:center;color:var(--mut);border-radius:50%;font-size:17px}
.rbra button:active{background:var(--user)}.rbra button.on{color:var(--acc)}
.rbra svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo .orb.pk-bounce{animation:pkb .8s ease-in-out 2}
.logo .orb.pk-peek{animation:pkp 1.8s ease-in-out}
.logo .orb.pk-dodge{animation:pkd 1.5s ease-in-out}
.logo .orb.pk-spin{animation:pks 1.2s ease-in-out}
.logo .orb.pk-wob{animation:pkw .9s ease-in-out}
.logo.mic::before{content:"";position:absolute;top:6px;right:calc(50% - min(33vw,130px));width:9px;height:9px;border-radius:50%;background:#34d27a;box-shadow:0 0 0 0 rgba(52,210,122,.6);animation:micp 1.6s infinite}
@keyframes micp{70%{box-shadow:0 0 0 9px rgba(52,210,122,0)}100%{box-shadow:0 0 0 0 rgba(52,210,122,0)}}
@keyframes pkb{50%{transform:translateY(-24px) scale(1.06)}}
@keyframes pkp{0%{transform:scale(1)}25%,60%{transform:scale(.16) translateY(70px);opacity:.15}82%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes pkd{0%{transform:translateX(0)}20%{transform:translateX(-70px) rotate(-6deg)}45%{transform:translateX(70px) rotate(6deg)}70%{transform:translateX(-30px)}100%{transform:translateX(0)}}
@keyframes pks{to{transform:rotate(360deg)}}
@keyframes pkw{20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.logo .orb{transition:width .45s,height .45s}
.mid.rp .logo .orb{width:min(42vw,160px);height:min(42vw,160px)}
.mid.rp .logo{padding-bottom:10px}
#rbf{display:flex;gap:9px;justify-content:center;margin:0 auto 6px}
#rbf button{display:flex;flex-direction:column;align-items:center;gap:3px;width:54px;color:var(--mut);font:600 10.5px/1 system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#rbf i{font-style:normal;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(226,236,255,.85));border:1px solid rgba(143,184,255,.55);box-shadow:0 5px 14px rgba(110,150,255,.22),inset 0 1px 0 #fff;transition:transform .15s}
#rbf button:active i{transform:scale(.9)}
#rbf button.on i{background:linear-gradient(135deg,#c9e6ff,#e6d6ff);box-shadow:0 0 0 3px rgba(120,170,255,.3),0 5px 14px rgba(110,150,255,.3)}
.mid.rp #rbf span{display:none}.mid.rp #rbf i{width:36px;height:36px;font-size:16px}
#rbl{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);width:min(92vw,360px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 14px 40px rgba(60,80,160,.28);z-index:25;opacity:0;pointer-events:none;transition:.25s}
#rbl.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#rbl h4{margin:0 0 10px;font:700 14px system-ui,sans-serif;display:flex;justify-content:space-between;align-items:center}
#rbl h4 button{font-size:18px;color:var(--mut);padding:0 4px}
#rbl .sty{display:flex;gap:10px}
#rbl .sc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;border:1.5px solid var(--line);font:600 12px system-ui,sans-serif}
#rbl .sc.on{border-color:#6a9cff;background:rgba(120,170,255,.12)}
#rbl .sc .orb{width:54px;height:54px;animation:none;pointer-events:none}
#rbl .sk{display:flex;gap:12px;margin-top:12px;align-items:center;font:600 12px system-ui,sans-serif}
#rbl .sw{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#35b4ff,#ff9fe0);position:relative;border:2px solid transparent}
#rbl .sw.on{border-color:#6a9cff}#rbl .sw.lk{filter:grayscale(1) opacity(.45)}
#rbl .sw.lk::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;filter:none}
.rbp{height:6px;border-radius:3px;background:rgba(120,150,220,.25);margin:6px 0 2px;overflow:hidden;min-width:160px}.rbp i{display:block;height:100%;background:linear-gradient(90deg,#3fdcff,#a56bff,#ff63d4);border-radius:3px}
#rbd{display:none;align-items:center;gap:10px;margin:0 auto;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid rgba(143,184,255,.6);background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(226,236,255,.82));color:#2b2a55;font:600 14px/1.2 system-ui,sans-serif;box-shadow:0 8px 24px rgba(110,150,255,.28),inset 0 1px 0 #fff;cursor:pointer;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
#rbd.on{display:flex;animation:rbdin .45s cubic-bezier(.2,1.3,.4,1)}
#rbd:active{transform:scale(.97)}
#rbd .orb{width:30px;height:30px;flex:none}
#rbd small{display:block;font-weight:500;font-size:11px;opacity:.65;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
#rbd .ar{font-size:20px;opacity:.55;margin-left:2px}
#rbd.bz::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:38%;background:linear-gradient(90deg,#3fdcff,#a56bff,#ff63d4);animation:rbdp 1.3s linear infinite}
#rbd.dn{box-shadow:0 8px 26px rgba(110,150,255,.4),0 0 0 3px rgba(120,200,255,.25),inset 0 1px 0 #fff}
@keyframes rbdin{from{opacity:0;transform:translateY(10px) scale(.9)}}
@keyframes rbdp{from{transform:translateX(-100%)}to{transform:translateX(280%)}}
#dg{position:relative;z-index:4}
#rbw{position:absolute;left:10px;top:-34px;display:flex;align-items:center;gap:8px;pointer-events:none}
#rbw .orb{width:52px;height:52px;animation:none;flex:none;filter:drop-shadow(0 4px 10px rgba(110,160,255,.45))}
#rbs{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:5px 11px;font:500 12.5px/1.2 system-ui,sans-serif;box-shadow:0 4px 14px rgba(90,110,200,.18);opacity:0;transform:translateX(-6px);transition:.25s;white-space:nowrap;margin-top:18px}
#rbs.on{opacity:1;transform:none}
@media (min-width:700px),(orientation:landscape) and (min-width:560px){
 section#app{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);grid-template-rows:auto auto minmax(0,1fr) auto}
 #app>.hd{grid-column:1/-1;grid-row:1}
 #app>.ph{grid-column:1;grid-row:2}
 #app>#pv{grid-column:1;grid-row:3/5;flex:none!important;height:auto;border-bottom:0;border-right:1px solid var(--line)}
 #app>#dg{grid-column:2;grid-row:3;align-self:end;height:0;border:0;cursor:default;pointer-events:none;display:block!important}
 #app>#chat{grid-column:2;grid-row:2/4;padding-bottom:76px}
 #app>.foot{grid-column:2;grid-row:4}
 #dg i{display:none}
 #rbw{top:-66px}
 section#app.nopv{grid-template-columns:1fr}#app.nopv>#chat,#app.nopv>.foot{grid-column:1}#app.nopv>#dg{display:none!important}
 section#app.fs{grid-template-columns:1fr}#app.fs>#pv{grid-column:1}#app.fs>#dg{display:none!important}
}
.logo{display:flex;justify-content:center;line-height:1;position:relative;padding-bottom:26px}
.logo::after{content:"";position:absolute;bottom:0;left:50%;width:46%;height:20px;margin-left:-23%;background:radial-gradient(ellipse,rgba(90,170,255,.36),rgba(255,160,225,.18) 55%,transparent 72%);filter:blur(6px);animation:orbsh 4.4s ease-in-out infinite}
#gr,#gp,#hch{display:none!important}
.logo .orb{width:min(66vw,260px);height:min(66vw,260px)}
.orb{display:inline-block;vertical-align:middle;width:92px;height:92px;overflow:visible;--lx:0;--ly:0;filter:hue-rotate(var(--hr,0deg)) drop-shadow(0 10px 16px rgba(70,100,170,.3));animation:orbf 4.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent;cursor:pointer}
.orb.mini{width:22px;height:22px;animation:none;filter:none}
body.inc .orb{filter:grayscale(.7) brightness(.8) drop-shadow(0 12px 26px rgba(60,60,90,.4))}
.orb circle,.orb ellipse{stroke:none}
.orb .rim{fill:none;stroke:url(#ogL);stroke-width:2;filter:blur(.6px)}
.orb .hue{animation:orbh 14s ease-in-out infinite alternate}
.orb .sk{transform-box:view-box;transform-origin:50px 50px;animation:orbo 26s linear infinite}
.orb .skc{transform-box:fill-box;transform-origin:center;animation:orbk 3.2s ease-in-out infinite}
.orb .rg{fill:none;stroke:#a98bff;stroke-width:1.1;opacity:0;transform-box:fill-box;transform-origin:center}
.orb[data-m=listen] .rg,.orb[data-m=speak] .rg,.orb[data-m=think] .rg{animation:orbr 2s ease-out infinite}
.orb .r2{animation-delay:1s!important}
.orb[data-m=think] .sk{animation-duration:5s}
.orb[data-m=speak] .sk{animation-duration:9s}
.orb.mini .sk,.orb.mini .rg,.orb.mini .rim{display:none}
body.inc .orb .sk{opacity:.4}
@keyframes orbh{to{filter:hue-rotate(22deg)}}
@keyframes orbo{to{transform:rotate(360deg)}}
@keyframes orbk{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}
@keyframes orbr{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}

.orb .bg{transition:filter .7s}
.orb .bg>g{opacity:.95}
.orb .halo{animation:orbg 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes orbg{50%{transform:scale(1.08);opacity:.75}}
.orb .bl{transform-box:fill-box;transform-origin:center;animation:orbd1 9s ease-in-out infinite alternate}
.orb .b2{animation-name:orbd2;animation-duration:11s}.orb .b3{animation-name:orbd3;animation-duration:8s}
.orb .b4{animation-name:orbd2;animation-duration:12s;animation-direction:alternate-reverse}.orb .b5{animation-name:orbd3;animation-duration:10s;animation-direction:alternate-reverse}
.orb .b6{animation-duration:7s}.orb .b7{animation-name:orbd3;animation-duration:6s}
.orb .eyes{transform:translate(calc(var(--lx)*.45px),calc(var(--ly)*.4px));transition:transform .2s ease-out}
.orb .ey{transform-box:fill-box;transform-origin:center;transition:transform .25s,opacity .2s}
.orb .ey ellipse{transition:opacity .15s}
.lid{transform-box:fill-box;transform-origin:50% 0;animation:orbd 5s infinite}
@keyframes orbd{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}97%{transform:scaleY(1)}98.5%{transform:scaleY(.08)}}
.orb .pr0{fill:none;stroke:rgba(143,184,255,.2);stroke-width:1}
.orb .pr{fill:none;stroke:#8fb8ff;stroke-width:1.7;stroke-linecap:round;transition:stroke-dasharray 1s}
.orb.mini .pr,.orb.mini .pr0{display:none}
.rbb{position:absolute;left:50%;bottom:calc(100% - 18px);transform:translate(-50%,6px) scale(.96);opacity:0;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 26px rgba(90,110,200,.2);border-radius:18px;padding:9px 14px;font:500 14px/1.35 system-ui,sans-serif;max-width:min(86vw,300px);width:max-content;text-align:center;transition:opacity .25s,transform .25s;z-index:5}
.rbb{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;bottom:calc(100% + 10px)!important;filter:drop-shadow(0 6px 10px rgba(80,100,190,.28))}
.rbb .cw{position:relative;animation:cldf 4.5s ease-in-out infinite}
.rbb .bt{position:relative;z-index:2;background:var(--card);color:var(--ink);border-radius:28px;padding:12px 22px;font:500 14px/1.4 system-ui,sans-serif}
.rbb .cb,.rbb .tr{position:absolute;background:var(--card);border-radius:50%;z-index:1}
.rbb .c1{width:36px;height:36px;left:10%;top:-15px}.rbb .c2{width:48px;height:48px;left:36%;top:-24px}.rbb .c3{width:32px;height:32px;right:9%;top:-13px}
.rbb .c4{width:30px;height:30px;left:-9px;bottom:8px}.rbb .c5{width:30px;height:30px;right:-9px;bottom:10px}
.rbb .t1{width:13px;height:13px;left:50%;bottom:-17px;margin-left:-6px}.rbb .t2{width:7px;height:7px;left:50%;bottom:-28px;margin-left:-3px}
@keyframes cldf{50%{transform:translateY(-4px)}}
.rbb.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.rbb button.rbc{font-size:13px;padding:6px 11px;border-radius:14px;margin:6px 3px 0;color:var(--ink)}
.rbb small{opacity:.7}
.rbb button{border:0;background:var(--user);border-radius:12px;font-size:21px;padding:4px 9px;margin:6px 3px 0;cursor:pointer}
.orb{--ac:#5ad8ff}
.orb rect{stroke:none}
.orb .shl{stroke:#c3cee6;stroke-width:1.1}
.orb .bz{fill:none;stroke:url(#ogZ);stroke-width:2.2}
.orb .lb,.orb .eg{fill:var(--ac);transition:fill .4s}
.orb .eg{animation:orbpl 2.6s ease-in-out infinite}
.orb .lb{animation:orbpl 3.2s ease-in-out infinite}
.orb .base{fill:var(--ac);opacity:.7;transition:fill .4s}
.orb.mini .ear,.orb.mini .eg,.orb.mini .lb,.orb.mini .base{display:none}
.orb[data-m=listen]{--ac:#7dffb0}.orb[data-m=think]{--ac:#a56bff}.orb[data-m=speak]{--ac:#4ad0ff}
.orb[data-m=happy],.orb[data-m=laugh]{--ac:#ff7ad8}.orb[data-m=sad]{--ac:#6f8cff}.orb[data-m=angry]{--ac:#ff5a5a}.orb[data-m=surprise]{--ac:#ffd85a}
.orb[data-m=sleep]{--ac:#9aa7c7}.orb[data-m=sleep] .lb,.orb[data-m=sleep] .eg{animation:none;opacity:.35}
.orb[data-m=think] .lb,.orb[data-m=think] .eg,.orb[data-m=speak] .lb,.orb[data-m=speak] .eg{animation-duration:.8s}
@keyframes orbpl{0%,100%{opacity:.55}50%{opacity:1}}
.orb .ep{stroke:none}
.orb .hp{opacity:0;transition:opacity .2s}
.orb[data-m=listen] .ey{transform:scale(1.16)}
.orb[data-m=think] .eyes{transform:translate(5px,-4px)}
.orb[data-m=think] .ey{transform:scale(.92,.86)}
.orb[data-m=think] .bl{animation-duration:2.6s}
.orb[data-m=think]{animation:orbt 1.5s ease-in-out infinite}
.orb[data-m=think] .bg{filter:hue-rotate(12deg) saturate(1.1)}
.orb[data-m=speak]{animation:orbsp .7s ease-in-out infinite}
.orb[data-m=speak] .ey{animation:orbs .55s ease-in-out infinite}
.orb[data-m=speak] .bl{animation-duration:3.4s}
.orb[data-m=happy] .ey,.orb[data-m=laugh] .ey{opacity:0}
.orb[data-m=happy] .hp,.orb[data-m=laugh] .hp{opacity:1}
.orb[data-m=happy] .bg,.orb[data-m=laugh] .bg{filter:hue-rotate(-14deg) saturate(1.25) brightness(1.05)}
.orb[data-m=laugh]{animation:orbl .45s ease-in-out infinite}
.orb[data-m=sad] .eyes{transform:translate(0,3px)}
.orb[data-m=sad] .ey{transform:scaleY(.78)}
.orb[data-m=sad] .ey.l{transform:scaleY(.78) rotate(10deg)}.orb[data-m=sad] .ey.r{transform:scaleY(.78) rotate(-10deg)}
.orb[data-m=sad] .bg{filter:hue-rotate(28deg) saturate(.7) brightness(.92)}
.orb[data-m=sad] .bl{animation-duration:16s}
.orb[data-m=angry] .ey.l{transform:scaleY(.7) rotate(-16deg)}.orb[data-m=angry] .ey.r{transform:scaleY(.7) rotate(16deg)}
.orb[data-m=angry] .bg{filter:hue-rotate(-55deg) saturate(1.35)}
.orb[data-m=angry] .bl{animation-duration:2.2s}
.orb[data-m=surprise] .ey{transform:scale(1.32)}
.orb[data-m=surprise] .bg{filter:brightness(1.12) saturate(1.1)}
.orb[data-m=sleep] .ey{transform:scaleY(.1)}
.orb[data-m=sleep] .bl{animation-duration:22s}
.orb[data-m=sleep]{animation-duration:7s}
.orb[data-m=sleep] .bg{filter:saturate(.8) brightness(.96)}
@keyframes orbf{50%{transform:translateY(-8px)}}
@keyframes orbsh{50%{transform:scaleX(.82);opacity:.7}}
@keyframes orbt{50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes orbsp{50%{transform:scale(1.045)}}
@keyframes orbl{50%{transform:translateY(-10px) scale(1.04)}}
@keyframes orbb{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}98.5%{transform:scaleY(.1)}}
@keyframes orbs{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1.12)}}
@keyframes orbd1{0%{transform:translate(-8px,-4px) scale(1)}100%{transform:translate(9px,7px) scale(1.18)}}
@keyframes orbd2{0%{transform:translate(8px,-7px) scale(1.1)}100%{transform:translate(-10px,6px) scale(.9)}}
@keyframes orbd3{0%{transform:translate(-6px,8px) scale(.9)}100%{transform:translate(7px,-9px) scale(1.15)}}
.mid h1{font:500 30px Georgia,serif;letter-spacing:-.3px}
.mid p{color:var(--mut);font-size:15px}
.box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.box textarea{width:100%;border:0;outline:0;background:none;color:var(--ink);font:16px/1.4 inherit;resize:none;min-height:44px;max-height:140px;padding:4px}
.row{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:4px}
.send{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
.send:disabled{opacity:.35}
.mic.rec{color:#fff;background:var(--acc);animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.55}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:9px 13px;border-radius:14px;font-size:14px}
.chip:active{background:var(--user)}
/* BUILDER */
#app{height:100%;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
.hd b{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.pill{display:flex;background:var(--user);border-radius:10px;padding:2px}
.pill button{padding:5px 11px;border-radius:8px;font-size:13px;color:var(--mut)}
.pill button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
#pv{flex:0 0 50%;background:#fff;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
#pv iframe{width:100%;height:100%;border:0;background:#fff}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:14px;text-align:center;padding:20px;pointer-events:none}
#cv{display:none;width:100%;height:100%;border:0;outline:0;resize:none;padding:10px;font:12px/1.55 ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink);white-space:pre;overflow:auto}
#pv.code iframe,#pv.code #empty{display:none}
#pv.code #cv{display:block}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}

async function gemG(sys,prompt,onT,ex){
  const model=curM();

  };
  let r;try{r=await fx(U,O)}catch(e){if(e.name==='AbortError')throw e;
    try{r=await fx(U+'&key='+encodeURIComponent(LS.g('gk')||''),Object.assign({},O,{headers:{'Content-Type':'application/json'}}))}catch(e2){if(e2.name==='AbortError')throw e2;throw new Error('Gemini se jud nahi paya. Internet check karo. Agar ye file Claude ke preview mein khuli hai to wo bahar ka network rok deta hai — file ko Chrome mein kholo.')}}
  if(!r.ok){const e=await r.text();let m='';try{m=JSON.parse(e).error.message||''}catch(x){}throw new Error(/API key|API_KEY/i.test(e)?'API key galat lag rahi hai':r.status===429?'Limit poori ho gayi — thodi der baad try karo':'Error '+r.status+': '+(m||e).slice(0,140))}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',acc='',last=0,fr='',um=null,pb='';
  while(true){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data:'))continue;
      try{const j=JSON.parse(l.slice(5)),c=j.candidates?.[0],p=c?.content?.parts;if(p)acc+=p.map(x=>x.text||'').join('');if(c?.finishReason)fr=c.finishReason;if(j.promptFeedback?.blockReason)pb=j.promptFeedback.blockReason;if(j.usageMetadata)um=j.usageMetadata}catch(e){}}
    if(onT&&Date.now()-last>350){last=Date.now();onT(acc)}

  if(!acc.trim())throw new Error('Gemini ne jawab nahi diya ('+(pb||fr||'khali')+') — image ya sawaal badal kar dekho');

  return acc;
}

async function oai(P,sys,prompt,onT,ex){
  const id=curP(),base=(id==='custom'?(LS.g('cb')||''):P.base).replace(/\/+$/,''),key=P.nokey?'':(LS.g(P.key)||'');
  if((ex||[]).some(x=>x.inlineData.mimeType==='application/pdf'))toast('PDF sirf Gemini padh sakta hai — doosre AI mein sirf photo jaati hai',4500);

  catch(e){if(e.name==='AbortError')throw e;throw new Error(P.n+' se jud nahi paya — internet ya Base URL check karo')}
  if(!r.ok){const e=await r.text();let m='';try{const j=JSON.parse(e);m=(j.error&&(j.error.message||j.error))||j.message||''}catch(x){}
    throw new Error(r.status===401||r.status===403?P.n+' ki API key galat hai':r.status===429?'Limit poori ho gayi — thodi der baad try karo ya doosra AI chuno':r.status===402?'Credit khatam — doosra AI chuno':'Error '+r.status+': '+String(m||e).slice(0,140))}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',acc='',raw='',last=0,fr='',tk=0;
  while(true){
    const {done,value}=await rd.read();if(done)break;
    const ch=dec.decode(value,{stream:true});raw+=ch;buf+=ch;
    const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data:')||l.includes('[DONE]'))continue;
      try{const j=JSON.parse(l.slice(5)),c0=j.choices&&j.choices[0];if(c0){const d=c0.delta&&c0.delta.content;if(d)acc+=d;if(c0.finish_reason)fr=c0.finish_reason}if(j.usage)tk=j.usage.total_tokens||0}catch(e){}}
    if(onT&&Date.now()-last>350){last=Date.now();onT(acc)}

  if(tk)LS.s('tok',String((+LS.g('tok')||0)+tk));
  if(!acc.trim())throw new Error(P.n+' ne jawab nahi diya — model badal kar dekho');
  if(fr==='length')toast('Jawab adhura raha — chhota badlav maango',4000);

function inl(p,t){

  while((m=re.exec(t))){

    const x=m[0];let e;
    if(x[0]==='`'){e=document.createElement('code');e.textContent=x.slice(1,-1)}
    else if(x.startsWith('**')){e=document.createElement('b');e.textContent=x.slice(2,-2)}
    else if(x[0]==='*'){e=document.createElement('i');e.textContent=x.slice(1,-1)}
    else{const k=x.indexOf('](');e=document.createElement('a');e.textContent=x.slice(1,k);e.href=x.slice(k+2,-1);e.target='_blank';e.rel='noopener'}

  }
  if(i<t.length)p.appendChild(document.createTextNode(t.slice(i)));
}

function mdText(el,t){

      const tb=document.createElement('table');tb.className='mt',cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      const th=document.createElement('tr');cells(l).forEach(c=>{const e=document.createElement('th');inl(e,c);th.appendChild(e)});tb.appendChild(th);i+=2;
      while(i<L.length&&TR.test(L[i])){const tr=document.createElement('tr');cells(L[i]).forEach(c=>{const e=document.createElement('td');inl(e,c);tr.appendChild(e)});tb.appendChild(tr);i++}
      el.appendChild(tb);continue}
    if(LI.test(l)){

      while(i<L.length&&LI.test(L[i])){const li=document.createElement('li');inl(li,L[i].replace(LI,''));ul.appendChild(li);i++}
      el.appendChild(ul);continue}
    if(/^>\s?/.test(l)){const q=document.createElement('blockquote'),a=[];while(i<L.length&&/^>\s?/.test(L[i])){a.push(L[i].replace(/^>\s?/,''));i++}inl(q,a.join('\n'));el.appendChild(q);continue}

}

const vst=(t,c)=>{$('vs').textContent=t;$('vo').className=c||''};

let vMu=0;
function vMute(){vMu=!vMu;$('vmu').classList.toggle('on',!!vMu);if(vMu){vtk++;try{if(vr){vr.x=1;vr.abort()}}catch(e){}vr=null;scx();vst('Mute hai — hatane ke liye mute dabao','')}else vListen()}
function voiceOn(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){alert('Is browser mein mic support nahi hai');return}
  if(!hasKey()){openSet();toast('Pehle API key daalo');return}
  vOn=1;vMu=0;$('vmu').classList.remove('on');$('vo').innerHTML=ic('mic');$('vm').classList.remove('hide');vListen()
}
function voiceOff(){vOn=0;vtk++;try{if(vr){vr.x=1;vr.abort()}}catch(e){}vr=null;scx();$('vm').classList.add('hide')}
function vListen(){
  if(!vOn||busy||vMu)return;
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;scx();
  let got=0,err=0;const r=vr=new R();r.lang=sv('vl');r.interimResults=false;
  r.onresult=e=>{got=1;vSend((e.results[0][0].transcript||'').trim())};
  r.onerror=e=>{err=1;vst(e.error==='not-allowed'||e.error==='service-not-allowed'?'Mic ki ijazat chahiye':e.error==='no-speech'?'Kuch suna nahi — tap karke bolo':'Mic nahi chala — tap karo','')};
  r.onend=()=>{if(vr===r)vr=null;if(vOn&&!got&&!err&&!r.x)vst('Kuch suna nahi — tap karke bolo','')};
  vst('Sun raha hoon…','l');try{r.start()}catch(e){vst('Mic nahi chala — tap karo','')}
}

 if(e.target.closest('#rbl [data-x]')){pan.classList.remove('on');return}

(function(){

 const f=t=>{if(/^\s*\[[^\]]{0,20}$/.test(String(t)))return onT('');const[md,x]=strip(t);if(md&&OK.includes(md)&&RB.aiMood!==md){RB.aiMood=md;RB.set(md,4200)}return onT(x)};
 return _gem(sys+'\n\nZaroori: har jawab ki sabse pehli line sirf [mood:X] ho, jahan X in mein se ek ho: idle, happy, laugh, sad, angry, surprise, think (jawab ke bhaav ke hisaab se). Uske baad normal jawab likho.',prompt,f,ex).then(r=>strip(r)[1])};
// tilt: eyes follow phone tilt

 if(mm&&!(typeof inc!=='undefined'&&inc)&&!LS.g('nm')){const nm=mm[1][0].toUpperCase()+mm[1].slice(1);LS.s('nm',nm);if(window.RBub&&!document.getElementById('home').classList.contains('hide'))setTimeout(()=>RBub('Pyaara naam, '+nm+'! Yaad rakh liya 😊',3800),900);RB.set('happy',2500)}}catch(e){}

(function(){
const $$=id=>document.getElementById(id),ho=()=>!$$('home').classList.contains('hide'),ic0=()=>typeof inc!=='undefined'&&!!inc;
const J=(k,d)=>{try{return JSON.parse(LS.g(k)||'')}catch(e){return d}};
// ---------- teasing: never repeats ----------
const OP=['Oye!','Psst…','Arre sunno,','Hello hello!','Ek second,','Breaking news:','Dhyan do,','Oho!','Chalo batao,','Ek baat bataun?','Ji sunie,','Hey hey!'];
const TE=['tum itni der se chup kyun ho?','mere paas ek idea hai, poochho to sahi!','meri aankhein dekho, kitni chamak rahi hain na?','bina bataye ek chhoti si website soch li hai maine','ek sawal: chai ya coffee? jaldi bolo!','agar main ek rang hota to kaun sa hota? guess karo','mujhe gudgudi ho rahi hai, ek tap kar do','paani pi liya? chalo ek ghoont abhi!','seedhe baitho, posture check ho raha hai','kya tum jaante ho? shehad kabhi kharab nahi hota','ek challenge: 10 second mein ek website ka naam socho','main kaan lagaye baitha hoon, kuch bolo','main bore nahi hoon, bas mazaa le raha hoon','aaj ka lucky number kaun sa hai tumhara?','ek chhota break lo, aankhein jhapkao','meri ek aankh dusri se chhoti hai — dhoondho!','kaun sa game banayein? snake ya ludo?','mujhe lagta hai tum kuch bana rahe ho andar hi andar','ek gaana gungunao, main sunta hoon','batao, kal kya khaya tha?','chalo ek jokes ka time: robot ne doctor ko kya kaha? "mujhe virus lag gaya!"','kabhi socha hai badal bhi sapne dekhte honge?','mujhe lag raha hai aaj tum kuch accha karne wale ho','ek tap karo, phir dekho kya hota hai','sir ghumao, gardan ki exercise karo','yahan koi hai? main hoon bas!','thoda muskurao, main dekh raha hoon','ek chhupa hua feature hai, dhoondho 😉','tumhari website me ek dhansu sa color daalein?','aaj mausam kaisa hai tumhare yahan?','dhyan se dekho, main hil raha hoon ya tum?','ek lamba saans lo… ab chhodo','mere paas paanch idea hain, ek chuno: 1, 2, 3, 4, 5','kuch naya try karein aaj?'];
const TA=['😜','😄','🤭','😎','✨','🙃','😏','🤖'];
const SO=['Kya tumne kabhi robot ko hichkiyan aate dekha hai? Hic! 😳','Main abhi 100% charge hoon aur 100% masti mein 🔋','Mera dost WiFi kehta hai ki main bahut dhimaa hoon 🐌','Sshh… deewaron ke bhi kaan hote hain 🤫','Tum itne serious kyun lag rahe ho? 😅','Ek tap karke dekho, kuch hoga… ya nahi hoga 🎲','Main sapne mein 1 crore lines ka code likh raha tha 💻','Aaj tumne mujhe kitni baar chhua? Gino mat, mujhe pata hai 😏','Dhyan do: main tumse zyada chamakdaar hoon ✨','Abhi mere andar ek tara phoota. Kuch mat poochho 🌟','Kal main bhi insaan banne ki koshish kar raha tha, nahi bana 🥲','Dekho dekho, main ghoom sakta hoon! 🌀','Main sun raha hoon, par mann mein hasi aa rahi hai 🤭'];
const RI=[['Jo jitna bhaage, utna peeche rehta hai — kya?','Parchhai! 🌑'],['Bina muh ke bolta hai, bina kaan ke sunta hai — kya?','Goonj (echo)! 📣'],['Jitna dhote hain utna gandla hota hai — kya?','Paani! 💧'],['Mere paas shehar hain par ghar nahi, jungle hain par ped nahi — kya?','Naksha (map)! 🗺️'],['Jo kabhi gira nahi par roz toot jaata hai — kya?','Din! 🌅'],['Jitna zyada loge, utna peeche chhodoge — kya?','Kadam! 👣'],['Ek dabba jisme na darwaza, na taala, par andar sone ka dhan — kya?','Anda! 🥚']];
const TS=['rb_seen'];let seen=new Set(J('rb_seen',[]));
const mark=k=>{seen.add(k);if(!ic0()){const a=[...seen].slice(-500);LS.s('rb_seen',JSON.stringify(a))}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function tease(){ // returns [text, answer?] never used before
 for(let i=0;i<60;i++){const r=Math.random();
  if(r<.18){const q=RI[Math.floor(Math.random()*RI.length)];if(!seen.has('r|'+q[0])){mark('r|'+q[0]);return['🧩 '+q[0],q[1]]}}
  else if(r<.4){const l=SO[Math.floor(Math.random()*SO.length)];if(!seen.has('s|'+l)){mark('s|'+l);return[l]}}
  else{const o=pick(OP),t=pick(TE),k='c|'+o+'|'+t;if(!seen.has(k)){mark(k);return[o+' '+t+' '+pick(TA)]}}}
 const o=pick(OP),t=pick(TE);return[o+' '+t+' '+pick(TA)+' ('+Math.floor(Math.random()*999)+')']}
window.RBTease=tease;
const PK=[['pk-bounce','laugh'],['pk-peek','surprise'],['pk-dodge','surprise'],['pk-spin','laugh'],['pk-wob','happy']];
let lastPk=Date.now()+30000,pks=J('rb_pk',[]);
function prank(){const o=document.querySelector('#home .logo .orb');if(!o)return;const[c,m]=pick(PK);o.classList.add(c);setTimeout(()=>o.classList.remove(c),1900);RB.set(m,2200);const t=tease();window.RBub&&RBub(t[0],6200);if(t[1])setTimeout(()=>{if(ho()&&window.RBub)RBub(t[1],4200)},7600)}
window.RBPrank=prank;
setInterval(()=>{if(LS.g('rb_q')==='1'||!ho()||document.hidden||(typeof busy!=='undefined'&&busy)||RB.typing||RB.m==='sleep')return;const n=Date.now();if(n-RB.act<30000||n-lastPk<60000+Math.random()*60000)return;pks=pks.filter(x=>n-x<36e5);if(pks.length>=6)return;pks.push(n);lastPk=n;prank()},15000);
// ---------- always-on mic ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,want=LS.g('rb_mic')!=='0',off=0,warned=0,fails=0;
const lg=()=>document.querySelector('#home .logo');
function can(){return SR&&want&&!off&&!document.hidden&&ho()&&!(typeof busy!=='undefined'&&busy)&&!window.__rbSpk&&!(typeof vOn!=='undefined'&&vOn)&&Date.now()-(window.__rbDict||0)>15000&&!/^(TEXTAREA|INPUT)$/.test((document.activeElement||{}).tagName)}
function note(t){if(warned||!window.RBub||!ho())return;warned=1;RBub(t,7000)}
function start(){if(rec||!can())return;try{rec=new SR();rec.lang='hi-IN';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
 rec.onstart=()=>{fails=0;const l=lg();l&&l.classList.add('mic')};
 rec.onresult=e=>{if(window.__rbSpk||(typeof busy!=='undefined'&&busy))return;let fin='',it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){if((r[0].confidence==null||r[0].confidence===0||r[0].confidence>=.45))fin+=r[0].transcript}else it+=r[0].transcript}
  if(it&&RB.m==='idle')RB.set('listen',1500);if(fin.trim())heard(fin.trim())};
 rec.onerror=e=>{const k=e.error;if(k==='not-allowed'||k==='service-not-allowed'){off=1;note('Mic ki permission nahi mili 🎙️ — permission do ya file ko Chrome mein kholo')}else if(k==='network'||k==='audio-capture'||k==='language-not-supported'){fails+=3}};
 rec.onend=()=>{rec=null;const l=lg();l&&l.classList.remove('mic');fails++;if(fails>9){off=1;note('Mic baar baar ruk raha hai 🎙️ — ye browser mein mic chalu nahi rakh pa raha');return}setTimeout(start,fails>3?3000:350)};
 rec.start()}catch(e){rec=null;fails++}}
window.RBMicHold=()=>{if(rec){try{rec.abort()}catch(e){}}};
window.RBMicKick=()=>{if(!rec)start()};
addEventListener('pointerdown',()=>{if(!rec&&!off)start()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.RBMicHold();else setTimeout(start,500)});
setInterval(()=>{if(!rec)start();else if(!can())window.RBMicHold()},2500);
// ---------- voice/text commands ----------
const QU=/(chup\s*ho\s*jao|chup\s*raho|chup\s*kar|shant\s*ho\s*jao|tang\s*mat\s*karo|pareshan\s*mat\s*karo|disturb\s*mat|be\s*quiet|stop\s*teasing)/i,PL=/(mazak\s*karo|masti\s*karo|pareshan\s*karo|tang\s*karo|phir\s*se\s*masti|tease\s*me)/i,MO=/(mic|mike|maik)\s*(band|bandh|off)/i,MN=/(mic|mike|maik)\s*(chalu|on|shuru)/i;
function cmd(t){t=String(t);if(MO.test(t)){want=false;LS.s('rb_mic','0');window.RBMicHold();const l=lg();l&&l.classList.remove('mic');window.RBub&&RBub('Mic band 🎙️ — wapas chalu karne ke liye "mic chalu karo" likho',4500);return 1}

 if(QU.test(t)){LS.s('rb_q','1');RB.set('happy',1500);window.RBub&&RBub('Theek hai, ab main shant 🤐',3500);return 1}
 if(PL.test(t)){LS.s('rb_q','0');lastPk=0;RB.set('laugh',1800);window.RBub&&RBub('Yeeeah! Masti shuru 😜',3000);setTimeout(prank,2500);return 1}
 return 0}
const _g6=go;go=function(t,m){if(m!=='retry'&&m!==true&&m!=='edit'&&cmd(t)){['hi','ci'].forEach(i=>{const e=$$(i);if(e)e.value=''});try{sync('hi');sync('ci')}catch(e){}return Promise.resolve()}return _g6(t,m)};
